<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carrinho - Brbados e Arrumados</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Brbados e Arrumados</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Produtos</a>
      <a href="cart.html">Carrinho</a>
    </nav>
  </header>

  <main class="carrinho">
    <h2>Seu Carrinho</h2>
    <div id="lista-carrinho" class="produtos"></div>
    <div class="resumo">
      <p>Total: <strong id="total">R$ 0,00</strong></p>
      <a href="checkout.html" class="btn">Finalizar Compra</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Brbados e Arrumados</p>
  </footer>

  <script>
    function carregarCarrinho() {
      const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
      const lista = document.getElementById('lista-carrinho');
      const totalEl = document.getElementById('total');
      lista.innerHTML = '';
      let total = 0;

      if (carrinho.length === 0) {
        lista.innerHTML = '<p>Seu carrinho está vazio.</p>';
        totalEl.textContent = 'R$ 0,00';
        return;
      }

      carrinho.forEach((item, index) => {
        total += item.preco;

        const div = document.createElement('div');
        div.className = 'produto';
        div.innerHTML = `
          <h4>${item.nome}</h4>
          <p>R$ ${item.preco.toFixed(2)}</p>
          <button onclick="removerItem(${index})">Remover</button>
        `;
        lista.appendChild(div);
      });

      totalEl.textContent = 'R$ ' + total.toFixed(2);
    }

    function removerItem(index) {
      let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
      carrinho.splice(index, 1);
      localStorage.setItem('carrinho', JSON.stringify(carrinho));
      carregarCarrinho();
    }

    carregarCarrinho();
  </script>
</body>
</html>
